name: Validate OAuth integration branch
on:
  push:
    branches: [feature/mcp-oauth]
  pull_request:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - name: Verify additive migrations on an existing user database
        run: |
          python3 - <<'PY'
          import sqlite3, glob
          db=sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys=ON')
          db.executescript(open('migrations/0001_initial.sql').read())
          db.execute("INSERT INTO user(id,name,email,created_at,updated_at) VALUES('existing','Existing','existing@example.com',1,1)")
          db.execute("INSERT INTO session(id,expires_at,token,created_at,updated_at,user_id) VALUES('session-1',999999999,'previous-token',1,1,'existing')")
          for path in sorted(glob.glob('migrations/*.sql'))[1:]:
              db.executescript(open(path).read())
          tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required={'jwks','oauth_client','oauth_resource','oauth_client_resource','oauth_refresh_token','oauth_access_token','oauth_consent','oauth_client_assertion'}
          assert required <= tables, required-tables
          assert db.execute("SELECT count(*) FROM user WHERE id='existing'").fetchone()[0] == 1
          assert db.execute("SELECT count(*) FROM session WHERE id='session-1'").fetchone()[0] == 1
          assert db.execute("PRAGMA foreign_key_check").fetchall() == []
          print('OAuth migration passed; existing user and session preserved')
          PY
